[project]
name = "rager"
version = "0.1.0"
description = "Caching based RAG primitives"
readme = "README.md"
authors = [
    { name = "Wannes Vantorre", email = "vantorrewannes@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "belljar>=3.0.0",
    "blake3>=1.0.9",
    "concresce>=4.0.0",
    "semantic-chunker>=0.2.0",
    "sentence-transformers>=5.6.0",
    "unstructured[md,pdf]>=0.24.0",
]

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
addopts = "--cov=rager --cov-report=html --cov-report=term-missing"
markers = [
    "unit: fast, isolated test of a single component with every external dependency mocked (tests/unit)",
    "integration: slower tests requiring external dependencies (tests/integration)",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/unit/**" = ["SLF001"]

[tool.ty.rules]
all = "error"

[[tool.uv.index]]
name = "pytorch-rocm"
url = "https://download.pytorch.org/whl/rocm7.2"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[project.optional-dependencies]
cpu = [
  "torch>=2.13.0",
]
cu130 = [
  "torch>=2.13.0",
]
rocm = [
  "torch>=2.13.0",
  "triton-rocm>=2.13.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
  { index = "pytorch-rocm", extra = "rocm" },
]
triton-rocm = [
  { index = "pytorch-rocm", extra = "rocm" },
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "lorem-text>=3.0",
    "prek>=0.4.8",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "ty>=0.0.58",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
    { extra = "rocm" },
  ],
]
