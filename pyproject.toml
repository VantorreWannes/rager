[project]
name = "rager"
version = "0.1.15"
description = "Caching based RAG primitives"
readme = "README.md"
authors = [
    { name = "Wannes Vantorre", email = "vantorrewannes@gmail.com" }
]
maintainers = [
    { name = "Wannes Vantorre", email = "vantorrewannes@gmail.com" }
]
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["rag", "retrieval-augmented-generation", "caching", "embeddings", "faiss", "nlp"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
requires-python = ">=3.14"
dependencies = [
    "belljar>=0.2.0",
    "blake3>=1.0.9",
    "concresce>=0.1.2",
    "faiss-cpu>=1.14.3",
    "numpy>=2.4.6",
    "semantic-chunker>=0.2.0",
    "sentence-transformers>=5.6.0",
    "tokenizers>=0.22.2",
    "transformers>=5.13.1",
    "unstructured-inference>=1.6.13",
    "unstructured[csv,md,pdf]>=0.24.0",
]

[project.urls]
Homepage = "https://github.com/VantorreWannes/rager"
Repository = "https://github.com/VantorreWannes/rager"
Issues = "https://github.com/VantorreWannes/rager/issues"
Changelog = "https://github.com/VantorreWannes/rager/releases"

[build-system]
requires = ["uv_build>=0.11.28,<0.12.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
filterwarnings = [
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
]
addopts = "--cov=rager --cov-report=html --cov-report=term-missing"
markers = [
    "smoke: instant sanity checks that the package imports and its model-free primitives work, with nothing mocked and no model downloads (tests/smoke)",
    "unit: fast, isolated test of a single component with every external dependency mocked (tests/unit)",
    "integration: slower tests requiring external dependencies (tests/integration)",
    "application: end-to-end user journeys composing multiple primitives with real models (tests/application)",
]

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D203", "D213", "COM812", "ISC001"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"tests/unit/**" = ["SLF001"]

[tool.ty.rules]
all = "error"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.optional-dependencies]
cpu = [
  "torch>=2.13.0",
  "torchvision>=0.28.0",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "lorem-text>=3.0",
    "prek>=0.4.8",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.21",
    "ty>=0.0.58",
]

[tool.uv]
override-dependencies = [
    "python-magic; sys_platform != 'win32'",
]
